<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Mirall — panel de inteligencia urbana en tiempo real sobre un mapa de Valencia">
  <defs>
    <linearGradient id="mnavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#14304f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mnavy)"/>

  <!-- schematic district choropleth -->
  <g opacity="0.55">
    <path d="M90 470 L260 430 L320 500 L230 560 L110 545 Z" fill="#1c3d5e"/>
    <path d="M260 430 L430 400 L470 480 L320 500 Z" fill="#234969"/>
    <path d="M430 400 L610 380 L640 470 L470 480 Z" fill="#2c5578"/>
    <path d="M610 380 L790 360 L810 460 L640 470 Z" fill="#1c3d5e"/>
    <path d="M320 500 L470 480 L500 570 L360 590 Z" fill="#2c5578"/>
    <path d="M470 480 L640 470 L660 560 L500 570 Z" fill="#234969"/>
    <path d="M790 360 L960 350 L980 450 L810 460 Z" fill="#2c5578"/>
    <path d="M640 470 L810 460 L830 550 L660 560 Z" fill="#1c3d5e"/>
  </g>

  <!-- status dots -->
  <g>
    <circle cx="300" cy="465" r="6" fill="#22c55e"/>
    <circle cx="540" cy="430" r="6" fill="#22c55e"/>
    <circle cx="720" cy="410" r="6" fill="#fbbf24"/>
    <circle cx="880" cy="400" r="6" fill="#22c55e"/>
    <circle cx="590" cy="520" r="6" fill="#94a3b8"/>
    <circle cx="420" cy="540" r="6" fill="#22c55e"/>
  </g>

  <!-- floating utility cards -->
  <g>
    <rect x="70" y="80" width="230" height="92" rx="6" fill="#ffffff"/>
    <text x="92" y="112" font-family="'Space Grotesk', Inter, sans-serif" font-size="15" font-weight="700" fill="#0b1f33">Calidad del aire</text>
    <text x="92" y="140" font-family="Inter, sans-serif" font-size="13" fill="#22c55e" font-weight="700">Buena · NO2 18 µg/m³</text>
    <rect x="92" y="150" width="186" height="5" rx="2.5" fill="#e6ebf1"/>
    <rect x="92" y="150" width="70" height="5" rx="2.5" fill="#22c55e"/>

    <rect x="900" y="70" width="230" height="92" rx="6" fill="#ffffff"/>
    <text x="922" y="102" font-family="'Space Grotesk', Inter, sans-serif" font-size="15" font-weight="700" fill="#0b1f33">Tráfico</text>
    <text x="922" y="130" font-family="Inter, sans-serif" font-size="13" fill="#fbbf24" font-weight="700">Denso · Av. del Cid</text>
    <rect x="922" y="140" width="186" height="5" rx="2.5" fill="#e6ebf1"/>
    <rect x="922" y="140" width="130" height="5" rx="2.5" fill="#fbbf24"/>

    <rect x="900" y="470" width="230" height="92" rx="6" fill="#ffffff"/>
    <text x="922" y="502" font-family="'Space Grotesk', Inter, sans-serif" font-size="15" font-weight="700" fill="#0b1f33">Pulso de Distrito</text>
    <text x="922" y="530" font-family="Inter, sans-serif" font-size="13" fill="#22c55e" font-weight="700">Normal · Ciutat Vella</text>
    <rect x="922" y="540" width="186" height="5" rx="2.5" fill="#e6ebf1"/>
    <rect x="922" y="540" width="52" height="5" rx="2.5" fill="#22c55e"/>
  </g>

  <text x="70" y="250" font-family="'Space Grotesk', Inter, sans-serif" font-size="42" font-weight="700" fill="#f4f6fb">Mirall</text>
  <text x="70" y="282" font-family="Inter, sans-serif" font-size="16" fill="#9aa4bf">Urban Intelligence Platform · Valencia, en tiempo real</text>
</svg>
