<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Gráfico de burbujas: renta neta por persona frente a quejas y sugerencias por 1.000 habitantes, distritos de València">
  <defs>
    <linearGradient id="bgwarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3ee"/>
      <stop offset="1" stop-color="#efe9df"/>
    </linearGradient>
    <linearGradient id="seq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5654d"/>
      <stop offset="1" stop-color="#2f5d62"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgwarm)"/>

  <!-- axes -->
  <g stroke="#ddd6cc" stroke-width="2">
    <line x1="140" y1="470" x2="1100" y2="470"/>
    <line x1="140" y1="120" x2="140" y2="470"/>
  </g>
  <g fill="#66615b" font-family="Inter, sans-serif" font-size="14">
    <text x="140" y="500">Renta neta por persona →</text>
    <text x="40" y="130" transform="rotate(-90 40 130)">Quejas y sugerencias / 1.000 hab. →</text>
  </g>

  <!-- gridlines -->
  <g stroke="#ddd6cc" stroke-width="1" opacity="0.6">
    <line x1="140" y1="370" x2="1100" y2="370"/>
    <line x1="140" y1="270" x2="1100" y2="270"/>
    <line x1="140" y1="170" x2="1100" y2="170"/>
    <line x1="380" y1="120" x2="380" y2="470"/>
    <line x1="640" y1="120" x2="640" y2="470"/>
    <line x1="900" y1="120" x2="900" y2="470"/>
  </g>

  <!-- bubbles: district renta vs quejas, sized by población -->
  <g opacity="0.88">
    <circle cx="230" cy="190" r="58" fill="#b5654d" opacity="0.85"/>
    <circle cx="420" cy="330" r="34" fill="#c4825f"/>
    <circle cx="540" cy="300" r="42" fill="#8f7857"/>
    <circle cx="690" cy="360" r="30" fill="#5f7e6a"/>
    <circle cx="760" cy="300" r="46" fill="#4b7470"/>
    <circle cx="860" cy="390" r="26" fill="#3a6a6c"/>
    <circle cx="960" cy="410" r="38" fill="#2f5d62"/>
    <circle cx="1020" cy="430" r="22" fill="#27535a"/>
  </g>

  <g fill="#1e1e1e" font-family="'Space Grotesk', Inter, sans-serif" font-size="30" font-weight="700">
    <text x="140" y="80">¿Más renta, más quejas?</text>
  </g>
  <text x="140" y="108" font-family="Inter, sans-serif" font-size="16" fill="#66615b">Renta y quejas y sugerencias por distrito · València, 2023</text>
</svg>
