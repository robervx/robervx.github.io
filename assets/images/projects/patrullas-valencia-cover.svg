<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Predicción de patrullas — mapa de calor esquemático de Valencia por franja horaria">
  <defs>
    <linearGradient id="bgv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3ee"/>
      <stop offset="1" stop-color="#e9e2d3"/>
    </linearGradient>
    <linearGradient id="barv" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f5d62"/>
      <stop offset="1" stop-color="#5c9aa0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgv)"/>

  <!-- schematic city grid -->
  <g stroke="#d9d0bc" stroke-width="1.5">
    <path d="M0 120 H1200 M0 220 H1200 M0 320 H1200 M0 420 H1200 M0 520 H1200"/>
    <path d="M150 0 V630 M340 0 V630 M560 0 V630 M780 0 V630 M980 0 V630"/>
  </g>

  <!-- demand bars by hour -->
  <g transform="translate(90,470)">
    <text x="0" y="-330" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="600" fill="#1e1e1e">Demanda prevista por franja horaria</text>
    <text x="0" y="-292" font-family="Inter, sans-serif" font-size="16" fill="#66615b">Tipología de intervención + dotación disponible + eventos de ciudad</text>

    <g font-family="Inter, sans-serif" font-size="12" fill="#66615b">
      <!-- bars: hour index 0..17, height varies -->
      <g fill="url(#barv)">
        <rect x="0"   y="-40"  width="46" height="40" rx="6"/>
        <rect x="58"  y="-70"  width="46" height="70" rx="6"/>
        <rect x="116" y="-58"  width="46" height="58" rx="6"/>
        <rect x="174" y="-96"  width="46" height="96" rx="6"/>
        <rect x="232" y="-132" width="46" height="132" rx="6"/>
        <rect x="290" y="-108" width="46" height="108" rx="6"/>
        <rect x="348" y="-150" width="46" height="150" rx="6"/>
        <rect x="406" y="-190" width="46" height="190" rx="6"/>
        <rect x="464" y="-166" width="46" height="166" rx="6"/>
        <rect x="522" y="-120" width="46" height="120" rx="6"/>
        <rect x="580" y="-86"  width="46" height="86" rx="6"/>
        <rect x="638" y="-64"  width="46" height="64" rx="6"/>
        <rect x="696" y="-48"  width="46" height="48" rx="6"/>
        <rect x="754" y="-40"  width="46" height="40" rx="6"/>
        <rect x="812" y="-52"  width="46" height="52" rx="6"/>
        <rect x="870" y="-78"  width="46" height="78" rx="6"/>
        <rect x="928" y="-104" width="46" height="104" rx="6"/>
        <rect x="986" y="-72"  width="46" height="72" rx="6"/>
      </g>
    </g>

    <!-- baseline -->
    <line x1="-10" y1="0" x2="1044" y2="0" stroke="#c9beac" stroke-width="1.5"/>
  </g>

  <!-- patrol markers -->
  <g fill="#b5654d">
    <circle cx="260" cy="150" r="7"/>
    <circle cx="430" cy="95" r="9"/>
    <circle cx="700" cy="180" r="6"/>
    <circle cx="880" cy="130" r="8"/>
  </g>
  <g fill="none" stroke="#b5654d" stroke-width="1.5" opacity="0.5">
    <circle cx="430" cy="95" r="20"/>
    <circle cx="880" cy="130" r="18"/>
  </g>
</svg>
