<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Focus — próximamente">
  <defs>
    <linearGradient id="fgray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7e1d3"/>
      <stop offset="1" stop-color="#d8d0bd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#fgray)"/>

  <!-- concentric focus rings -->
  <g opacity="0.5" fill="none" stroke="#a49a83">
    <circle cx="880" cy="300" r="70" stroke-width="2"/>
    <circle cx="880" cy="300" r="130" stroke-width="2"/>
    <circle cx="880" cy="300" r="190" stroke-width="2"/>
    <circle cx="880" cy="300" r="250" stroke-width="2"/>
  </g>
  <circle cx="880" cy="300" r="10" fill="#8a7f66"/>

  <rect x="70" y="480" width="150" height="26" rx="13" fill="#a49a83" opacity="0.35"/>
  <text x="92" y="497" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#4a4434">Próximamente</text>

  <text x="70" y="250" font-family="'Space Grotesk', Inter, sans-serif" font-size="42" font-weight="700" fill="#3c362c">Focus</text>
  <text x="70" y="282" font-family="Inter, sans-serif" font-size="16" fill="#6b6350">Sistema personal de foco y ejecución</text>
</svg>
